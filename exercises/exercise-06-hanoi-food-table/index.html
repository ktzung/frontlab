
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 06 - Các món ngon Hà Nội</title>
  <style>
    * { box-sizing: border-box; }

    body {
         margin: 0;
         padding: 32px 16px;

        font-family: Georgia, "Times New Roman", serif;
        background: #FAF3E0;
        display: flex;
        justify-content: center;
    }

    .bai-viet {
        width: min(800px, 100%);
    }

    .bai-viet h1 {
        margin: 0 0 22px;
        text-align: center;
        color: #E65100;
        font-size: 26px;
    }

    .bo-cuc {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 24px;
        align-items: start;
    }

    .bo-cuc img {
        width: 100%;
        border-radius: 10px;
        display: block;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    th, td {

         padding: 9px 12px;
         border-bottom: 1px solid #E0D6C2;
         text-align: left;
    }

    thead th {
         background: #E65100;
         color: #ffffff;
    }

    tbody tr:nth-child(even) {
         background: #FDF8EF;
    }

    th:first-child,
    td:first-child {
         width: 60px;
         text-align: center;
    }

    @media (max-width: 600px) {
         .bo-cuc {
             grid-template-columns: 1fr;
         }
         .bo-cuc img {
             max-width: 200px;
             margin: 0 auto;
         }
    }
  </style>
</head>
<body>
  <article class="bai-viet">
    <h1>Các món ngon Hà Nội</h1>

    <div class="bo-cuc">
         <img src="assets/Bat.gif" alt="Ẩm thực truyền thống Hà Nội">

      <table>
          <thead>
             <tr>
              <th>STT</th>
              <th>Tên món ăn</th>
             </tr>
          </thead>
          <tbody>
             <tr><td>1</td><td>Bánh cuốn Thanh Trì</td></tr>
             <tr><td>2</td><td>Xôi Hà Nội</td></tr>
             <tr><td>3</td><td>Chả cá Lã Vọng</td></tr>
             <tr><td>4</td><td>Cháo Cóc</td></tr>
             <tr><td>5</td><td>Bánh Gai Ninh Giang</td></tr>
             <tr><td>6</td><td>Bún Thang Hà Nội</td></tr>
             <tr><td>7</td><td>Canh Lằng</td></tr>
             <tr><td>8</td><td>Vịt quay Lạng Sơn</td></tr>
          </tbody>
      </table>
    </div>
  </article>
</body>
</html>
