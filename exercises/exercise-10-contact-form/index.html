
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 10 - Biểu mẫu liên hệ</title>
  <style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 32px 16px;
        font-family: Arial, "Segoe UI", sans-serif;
        background: #f1f5f9;
        display: flex;
        justify-content: center;
    }

    .the-form {
        width: min(660px, 100%);
        background: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.12);
    }

    header {
        background: #0f766e;
        color: #ffffff;
        padding: 20px 26px;
    }

    header h1 { margin: 0; font-size: 22px; }
    header p   { margin: 6px 0 0; font-size: 14px; opacity: 0.9; }

    form { padding: 24px 26px; }

    .dong-2-cot {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 16px;
    }

    .truong-don { margin-bottom: 16px; }

    label.nhan {

        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
        color: #334155;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select,
    textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font: inherit;
        font-size: 14px;
    }

    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #0f766e;
        box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
    }

    .hang-kiem {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 14px;
        color: #334155;
        margin-bottom: 18px;
    }

    .nhom-nut { display: flex; gap: 10px; }

    button {

         border: none;
         padding: 11px 22px;
         border-radius: 6px;
         font: inherit;
         font-size: 15px;
         font-weight: 600;
         cursor: pointer;
    }

    .nut-gui { background: #0f766e; color: #ffffff; }
    .nut-xoa { background: #e2e8f0; color: #334155; }

    @media (max-width: 560px) {
         .dong-2-cot { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <article class="the-form">
    <header>
         <h1>Liên hệ với chúng tôi</h1>
         <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
    </header>

    <form action="#" method="post">
         <div class="dong-2-cot">
             <div>
               <label class="nhan" for="ho-ten">Họ và tên</label>
               <input type="text" id="ho-ten" name="hoTen" value="Nguyễn Văn An" required>
             </div>
             <div>
               <label class="nhan" for="email">Email</label>
               <input type="email" id="email" name="email" value="an.nv@tlu.edu.vn" required>
             </div>
         </div>

      <div class="dong-2-cot">
          <div>
              <label class="nhan" for="dien-thoai">Số điện thoại</label>
              <input type="tel" id="dien-thoai" name="dienThoai" value="0987 654 321">
          </div>
          <div>
              <label class="nhan" for="chu-de">Chủ đề</label>
              <select id="chu-de" name="chuDe">
               <option value="khoa-hoc">Hỏi về khoá học</option>
               <option value="ky-thuat">Hỗ trợ kỹ thuật</option>
               <option value="khac">Khác</option>
              </select>
          </div>
      </div>

      <div class="truong-don">
          <label class="nhan" for="noi-dung">Nội dung</label>
          <textarea id="noi-dung" name="noiDung" rows="4" required>Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ.</textarea>
      </div>

      <div class="hang-kiem">
          <input type="checkbox" id="dong-y" name="dongY" checked>
          <label for="dong-y">Tôi đồng ý nhận email phản hồi.</label>
      </div>

      <div class="nhom-nut">
          <button type="submit" class="nut-gui">Gửi liên hệ</button>
          <button type="reset" class="nut-xoa">Nhập lại</button>
      </div>
    </form>
  </article>
</body>
</html>
