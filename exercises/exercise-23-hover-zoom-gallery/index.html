
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 23 - Thư viện ảnh hiệu ứng Hover Zoom</title>
  <style>
    * { box-sizing: border-box; }

    body {
         margin: 0;
         padding: 32px 16px;
         font-family: Arial, "Segoe UI", sans-serif;
         background: #f8fafc;
    }

    .khung-bai {
         max-width: 1000px;
         margin: 0 auto;
    }

    .khung-bai h1 {
         text-align: center;
         font-size: 26px;
         margin: 0 0 4px;
         color: #0f172a;
    }

    .mo-ta {
         text-align: center;
         color: #64748b;

        font-size: 14px;
        margin: 0 0 26px;
    }

    .luoi-anh {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
    }

    .o-anh {
        margin: 0;
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        cursor: pointer;
    }

    .o-anh img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        display: block;
        transform: scale(1.02);
        transition: transform 0.4s ease;
    }

    .o-anh:hover img {
        transform: scale(1.12);
    }

    .lop-phu {
        position: absolute;
        inset: auto 0 0 0;
        padding: 12px 14px 10px;
        color: #ffffff;
        font-size: 14px;

         font-weight: 600;
         background: linear-gradient(transparent, rgba(0, 0, 0, 0.78));
    }

    @media (max-width: 768px) {
         .luoi-anh { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 480px) {
         .luoi-anh { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="khung-bai">
    <h1>Thư viện ảnh — Hiệu ứng Hover</h1>
    <p class="mo-ta">Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú thích.</p>

    <div class="luoi-anh">
         <figure class="o-anh">
           <img src="assets/1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">
           <figcaption class="lop-phu">Vịnh Hạ Long</figcaption>
         </figure>
         <figure class="o-anh">
           <img src="assets/2-son-doong.jpg" alt="Hang Sơn Đoòng">
           <figcaption class="lop-phu">Hang Sơn Đoòng</figcaption>
         </figure>
         <figure class="o-anh">
           <img src="assets/3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">
           <figcaption class="lop-phu">Thác Bản Giốc</figcaption>
         </figure>
         <figure class="o-anh">
           <img src="assets/4-fansipan.jpg" alt="Đỉnh Fansipan">
           <figcaption class="lop-phu">Fansipan</figcaption>
         </figure>
         <figure class="o-anh">
           <img src="assets/5-mekong.jpg" alt="Đồng bằng sông Cửu Long">

          <figcaption class="lop-phu">Đồng bằng sông Cửu Long</figcaption>
      </figure>
      <figure class="o-anh">
          <img src="assets/6-phong-nha.jpg" alt="Động Phong Nha">
          <figcaption class="lop-phu">Động Phong Nha</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
